name: Regression Tests

on:
  pull_request:
    branches: [main, master, feat/homepage-client-registration-entry]
  push:
    branches: [fix/permissions-client-payment-audit]

permissions:
  contents: read

jobs:
  test:
    name: Node regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression tests
        run: npm test
