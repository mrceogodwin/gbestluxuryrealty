name: CI
on:
  push:
    branches:
      - main
      - feature/client-registration-manual-payment
      - feat/gbest-marketing-content
  pull_request:
    branches:
      - main
      - feat/gbest-marketing-content
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm test\n      - run: npm run build
